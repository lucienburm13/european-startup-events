name: Build location cache

on:
  push:
    branches: [site-v0.1]
    paths:
      - 'scripts/geocode_locations.py'
      - '.github/workflows/geocode-locations.yml'
      - 'site/public/events.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build cached city coordinates
        run: python scripts/geocode_locations.py
      - name: Commit cache if changed
        run: |
          git add site/public/locations.json
          if git diff --cached --quiet; then
            echo "No location changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh derived location cache"
          git push origin HEAD:site-v0.1
