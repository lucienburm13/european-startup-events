name: Cache organisation logos

on:
  workflow_dispatch:
  push:
    branches: [site-v0.1]
    paths:
      - 'scripts/cache_org_logos.py'
      - '.github/workflows/cache-org-logos.yml'

permissions:
  contents: write

concurrency:
  group: cache-org-logos-site-v0.1
  cancel-in-progress: true

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install logo fetch dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Cache logo assets
        run: python scripts/cache_org_logos.py
      - name: Commit cached logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/organizations.json site/public/org-logos
          if git diff --cached --quiet; then
            echo "No logo changes."
            exit 0
          fi
          git commit -m "Cache startup organisation logos locally"
          git push origin HEAD:site-v0.1
